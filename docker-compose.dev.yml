services:
  frontend:
    image: node:18-alpine
    container_name: bfs-portal-frontend
    restart: unless-stopped
    ports:
      - "9000:3000"
    working_dir: /app
    environment:
      PORT: "3000"
      HOST: "0.0.0.0"
      WDS_SOCKET_PORT: "9000"
      DANGEROUSLY_DISABLE_HOST_CHECK: "true"
      BROWSER: "none"
      CI: "true"
    volumes:
      - ./frontend:/app
    command: sh -c 'npm install --no-audit --no-fund && npm start'
    depends_on:
      - backend

  backend:
    image: node:18-alpine
    container_name: bfs-portal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - audit_data:/data
    ports:
      - "9001:3000"
    working_dir: /app
    volumes:
      - ./backend:/app
    command: sh -c 'npm install --no-audit --no-fund && node index.js'

  mock-api:
    image: node:18-alpine
    container_name: bfs-portal-mock-api
    restart: unless-stopped
    ports:
      - "9002:3002"
    working_dir: /app
    volumes:
      - ./mock-apis:/app
    command: sh -c 'npm install --no-audit --no-fund && node server.js'

volumes:
  audit_data:

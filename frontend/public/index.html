<!DOCTYPE html>
<html lang="de" class="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b0f16" />
    <title>BFS Self-Service Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      :root { color-scheme: dark; }
      body {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        background: #0b0f16;
        -webkit-font-smoothing: antialiased;
      }
      code, pre, .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

      /* Dezente Bildlaufleiste — die hellen Standardleisten zerreissen sonst das dunkle Bild. */
      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 6px; border: 2px solid #0b0f16; }
      ::-webkit-scrollbar-thumb:hover { background: #334155; }

      @keyframes riseIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
      .rise-in { animation: riseIn .22s ease-out both; }

      @keyframes pulseDot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      .thinking-dot { animation: pulseDot 1.1s ease-in-out infinite; }
      .thinking-dot:nth-child(2) { animation-delay: .18s; }
      .thinking-dot:nth-child(3) { animation-delay: .36s; }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>

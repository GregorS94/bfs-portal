<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ffffff" />
    <title>BFS Self-Service Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Lato und Open Sans sind die Schriften von bfs-abrechnung.de. -->
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Open+Sans:wght@400;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Die Hausfarben stammen nicht aus dem Gefühl, sondern aus der Website:
      // gemessen an den tatsächlich gerenderten Farben von bfs-abrechnung.de.
      //   #331d0b  Fließtext, warmes Fast-Schwarz
      //   #db6900  Akzent, kontraststark genug auf Weiß
      //   #ff7700  hellere Variante für Hover
      //   #fdd79a  zarter Aprikoston für Flächen
      //   #ebebeb  Linien und Trennungen
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              tinte:   '#331d0b',
              gedimmt: '#6b5c4c',
              leise:   '#8a7c6c',
              akzent:  { DEFAULT: '#db6900', hell: '#ff7700', zart: '#fdf1e3', rand: '#f0c79a' },
              linie:   '#e5e2dd',
              flaeche: '#f6f5f3'
            },
            fontFamily: {
              sans: ['Open Sans', 'system-ui', 'sans-serif'],
              kopf: ['Lato', 'Open Sans', 'system-ui', 'sans-serif'],
              mono: ['JetBrains Mono', 'ui-monospace', 'monospace']
            },
            borderRadius: { DEFAULT: '3px', md: '4px', lg: '5px', xl: '6px', '2xl': '8px' }
          }
        }
      };
    </script>
    <style>
      :root { color-scheme: light; }
      body {
        font-family: 'Open Sans', system-ui, -apple-system, sans-serif;
        background: #f6f5f3;
        color: #331d0b;
        -webkit-font-smoothing: antialiased;
      }
      h1, h2, h3 { font-family: 'Lato', 'Open Sans', sans-serif; }
      code, pre, .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }

      ::-webkit-scrollbar { width: 10px; height: 10px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d8d4cd; border-radius: 5px; border: 2px solid #f6f5f3; }
      ::-webkit-scrollbar-thumb:hover { background: #bfb9b0; }

      @keyframes riseIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
      .rise-in { animation: riseIn .18s ease-out both; }

      @keyframes pulseDot { 0%,100% { opacity: .35; } 50% { opacity: 1; } }
      .thinking-dot { animation: pulseDot 1.1s ease-in-out infinite; }
      .thinking-dot:nth-child(2) { animation-delay: .18s; }
      .thinking-dot:nth-child(3) { animation-delay: .36s; }

      /* Überschrift mit orangefarbenem Strich — das Erkennungszeichen der BFS-Seite. */
      .bfs-strich::after {
        content: ''; display: block; width: 44px; height: 2px;
        background: #db6900; margin-top: 6px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>

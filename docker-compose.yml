services:
  frontend:
    build: ./frontend
    image: bfs-portal-frontend:prod
    container_name: bfs-portal-frontend
    restart: unless-stopped
    ports:
      - "9000:80"
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3

  backend:
    build: ./backend
    image: bfs-portal-backend:prod
    container_name: bfs-portal-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
    volumes:
      - audit_data:/data
    ports:
      - "9001:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  mock-api:
    build: ./mock-apis
    image: bfs-portal-mock-api:prod
    container_name: bfs-portal-mock-api
    restart: unless-stopped
    ports:
      - "9002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  audit_data:

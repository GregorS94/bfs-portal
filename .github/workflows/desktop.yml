# Baut das Desktop-Programm für Windows und macOS.
#
# Warum in der Cloud und nicht auf dem eigenen Rechner: Ein Windows-Paket
# lässt sich nur unter Windows bauen, ein macOS-Paket nur unter macOS. GitHub
# stellt beides bereit; wer nur einen Mac hat, käme sonst nie an ein .msi.
#
# Läuft auf Zuruf (Actions → Desktop → Run workflow) und bei jedem Tag v*.
# Signiert wird hier noch nicht — dafür muss erst das Zertifikat vorliegen.
# Wo es hingehört, steht unten als Kommentar.
#
# Kein `npm --prefix` und kein `cd` in Befehlszeilen: `--prefix` verhält sich
# unter Windows anders als unter Linux (npm suchte die package.json im
# Wurzelverzeichnis statt im angegebenen Ordner), und `cd ../x && ...` bricht
# sich an der Windows-Eingabeaufforderung. `working-directory` tut überall
# dasselbe.

name: Desktop

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  bauen:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows
          - os: macos-latest
            name: macos
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      # Rust-Abhängigkeiten sind der langsame Teil. Ohne Zwischenspeicher
      # dauert jeder Lauf zehn Minuten länger.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Abhängigkeiten der Oberfläche
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Oberfläche bauen
        working-directory: frontend
        env:
          # Muss hier stehen, nicht beim Tauri-Schritt: Vite backt den Wert
          # beim Bauen der Oberfläche ein. Im Programm ist der Ursprung
          # tauri://localhost, ein relativer /api-Pfad ginge ins Leere.
          # Hinterlegt unter Settings → Secrets and variables → Actions →
          # Variables als PORTAL_URL.
          VITE_API_BASE: ${{ vars.PORTAL_URL }}
        run: npm run build

      - name: Fehlende Portal-Adresse melden
        if: vars.PORTAL_URL == ''
        run: echo "::warning::Die Variable PORTAL_URL ist nicht gesetzt. Das Paket entsteht, aber das Programm findet das Portal nicht."

      - name: Tauri vorbereiten
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Paket bauen
        working-directory: desktop
        # Hier kommen später die Zertifikate dazu:
        #   Windows: TAURI_WINDOWS_SIGN_COMMAND oder signtool über eure PKI
        #   macOS:   APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY,
        #            APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID
        run: npm run build

      - name: Pakete einsammeln
        uses: actions/upload-artifact@v4
        with:
          name: bfs-support-${{ matrix.name }}
          if-no-files-found: error
          path: |
            desktop/src-tauri/target/release/bundle/msi/*.msi
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
